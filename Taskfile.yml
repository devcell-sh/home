version: "3"

tasks:
  test:
    desc: Run all tests
    cmds:
      - cmd: task test:lint || echo "SKIP test:lint (lint tools not installed)"
      - cmd: task test:shellcheck || echo "SKIP test:shellcheck (shellcheck not installed)"
      - task: test:eval
      - task: test:unit
      - task: test:flake
      - task: test:stacks

  test:stacks:
    desc: Verify ultimate/bbb package, MCP and image-layer boundaries
    cmds:
      - nix eval .#stackChecks --json

  test:lint:
    desc: Lint nix files with statix and deadnix
    preconditions:
      - sh: command -v statix
        msg: "statix not found (enable the nixos module or: nix profile install nixpkgs#statix)"
      - sh: command -v deadnix
        msg: "deadnix not found (enable the nixos module or: nix profile install nixpkgs#deadnix)"
    cmds:
      - statix check .
      - deadnix --fail .

  test:shellcheck:
    desc: Lint shell scripts (s6 services)
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not found: nix profile install nixpkgs#shellcheck"
    cmds:
      - cmd: |
          find modules/s6 \( -name 'up' -o -name 'run' \) -not -path '*/data/*' \
            | sort | xargs shellcheck

  test:eval:
    desc: Evaluate homeConfigurations across all platforms (linux, darwin, wsl, vagrant)
    vars:
      CONFIGS:
        sh: nix eval .#homeConfigurations --apply 'builtins.attrNames' --json 2>/dev/null | jq -r '.[]' | grep -E '^(devcell|wsl)-'
    cmds:
      - for: { var: CONFIGS }
        cmd: |
          echo "eval: {{.ITEM}}"
          nix eval .#homeConfigurations."{{.ITEM}}".activationPackage.drvPath --raw > /dev/null

  test:unit:
    desc: Run bats unit tests
    preconditions:
      - sh: command -v bats
        msg: "bats not found: nix profile install nixpkgs#bats"
    cmds:
      - bats tests/*_test.bats

  test:codex:
    desc: Build pinned Codex and verify MCP generation, merging and CLI compatibility
    cmds:
      - bats tests/codex_mcp_merge_test.bats

  test:e2e:
    desc: Run e2e tests (requires sudo, run inside container)
    preconditions:
      - sh: command -v bats
        msg: "bats not found: nix profile install nixpkgs#bats"
    cmds:
      - bats tests/e2e/*.bats

  test:e2e:demo:
    desc: Visual feature demo (desktop, stealth browser, Inkscape, KiCad)
    preconditions:
      - sh: command -v uv
        msg: "uv not found: nix profile install nixpkgs#uv"
      - sh: command -v import
        msg: "import (ImageMagick) not found"
    cmds:
      - uv run tests/demo/feature_demo_test.py

  test:flake:
    desc: Validate flake metadata and outputs structure
    cmds:
      - nix flake metadata --json > /dev/null
      - nix eval .#devcellModules --json > /dev/null
      - nix eval .#devcellProfiles --json > /dev/null
      - nix eval .#devcellCatalog --json > /dev/null
