name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install dev tools
        run: nix profile install nixpkgs#go-task nixpkgs#statix nixpkgs#deadnix nixpkgs#nixfmt-rfc-style

      - name: Run tests
        run: task test
