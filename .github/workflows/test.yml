name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install dev tools
        run: nix profile install nixpkgs#go-task nixpkgs#statix nixpkgs#deadnix nixpkgs#nixfmt-rfc-style nixpkgs#shellcheck nixpkgs#bats nixpkgs#bats.libraries.bats-support nixpkgs#bats.libraries.bats-assert

      - name: Run tests
        run: |
          export BATS_LIB_PATH="$HOME/.local/state/nix/profiles/profile/share/bats"
          task test
